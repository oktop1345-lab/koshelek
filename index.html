<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Мой кошелёк</title>
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one column ledger; summary strip, entry form, two charts side by side, then the journal */
/* Single white theme with gold accents (user palette: #B69924 #988432 #8C7413 #BA9D29 #BA9E2C) */
:root{
  --bg:#FFFFFF; --field:#FBF9F2; --surface:#FFFFFF; --ink:#2A2414; --muted:#7A6F55; --line:#E8E0C6;
  --gold:#B69924; --gold-2:#988432; --gold-dark:#8C7413; --gold-3:#BA9D29; --gold-4:#BA9E2C;
  --accent:#8C7413; --income:#5E7F2A; --expense:#B24A2E;
  --c1:#B69924; --c2:#8C7413; --c3:#D8C477; --c4:#5C4B0E; --c5:#988432; --c6:#C9A96B; --c7:#7D6A4A; --c8:#E6D9A8; --c9:#A9A08A;
  --display:"Unbounded",system-ui,sans-serif; --body:"Golos Text",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
h1{color:var(--gold-dark);font-family:var(--display);font-weight:700;font-size:clamp(24px,5vw,34px);margin:0;letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:500;font-size:15px;margin:0 0 14px;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0}
.month{display:flex;align-items:center;gap:6px}
.month span{font-weight:600;min-width:130px;text-align:center}
button,input,select{font:inherit;color:inherit}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:18px}
.iconbtn:hover{border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.summary{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:14px}
.summary>div{padding:16px 18px;min-width:0}
.summary>div+div{border-left:1px solid var(--line)}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.big{font-family:var(--mono);font-size:clamp(17px,3.4vw,26px);margin-top:4px;overflow-wrap:anywhere}
.inc{color:var(--income)} .exp{color:var(--expense)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
form{display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:10px;align-items:end}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--muted)}
input,select{height:40px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--field);width:100%;min-width:0}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;height:40px}
.seg button{border:0;background:transparent;padding:0 14px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"].e{background:var(--expense);color:#fff}
.seg button[aria-pressed="true"].i{background:var(--income);color:#fff}
.note{grid-column:1 / 4}
.submit{height:40px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
.submit:hover{background:var(--gold)}
.submit:disabled{opacity:.5;cursor:default}
.charts{display:grid;grid-template-columns:1fr 1.25fr;gap:20px}
.donut-box{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut-box svg{flex:0 0 auto}
.legend{display:grid;gap:6px;flex:1;min-width:170px;margin:0;padding:0;list-style:none}
.legend li{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center;font-size:14px}
.sw{width:10px;height:10px;border-radius:3px}
.legend .pct{color:var(--muted);font-size:12px;margin-left:6px}
.empty{color:var(--muted);font-size:14px;padding:18px 0}
.keys{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:6px}
.keys i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.list{display:grid}
.row{display:grid;grid-template-columns:62px 1fr auto 32px;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .d{color:var(--muted);font-size:13px}
.row .t{min-width:0}
.row .t b{font-weight:500}
.row .t small{display:block;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.del{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:18px;border-radius:8px;height:32px}
.del:hover{color:var(--expense);background:var(--field)}
.status{font-size:13px;color:var(--muted);min-height:18px}
@media (max-width:760px){
  form{grid-template-columns:1fr 1fr}
  .seg{grid-column:1 / 3}
  .note{grid-column:1 / 3}
  .submit{grid-column:1 / 3}
  .charts{grid-template-columns:1fr}
}
@media (max-width:480px){
  .summary{grid-template-columns:1fr}
  .summary>div+div{border-left:0;border-top:1px solid var(--line)}
  .row{grid-template-columns:52px 1fr auto 28px;gap:8px}
}
</style>
<style>
body{margin:0;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
.auth{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.linkbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;height:36px;padding:0 12px;cursor:pointer;color:var(--gold-dark);font-weight:500}
.linkbtn:hover{border-color:var(--gold)}
.headright{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.setup{border:1px dashed var(--gold);background:var(--field);border-radius:14px;padding:16px 18px}
.setup b{color:var(--gold-dark)}
.periods{display:flex;flex-wrap:wrap;gap:8px}
.periods button{height:36px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted);cursor:pointer;font-weight:500}
.periods button:hover{border-color:var(--gold)}
.periods button[aria-pressed="true"]{background:var(--gold-dark);border-color:var(--gold-dark);color:#fff}
.month span{min-width:170px}
.iconbtn:disabled{opacity:.35;cursor:default}
.summary{grid-template-columns:repeat(4,1fr)}
.summary>.tile{border:0}
.summary>.tile+.tile{border-left:1px solid var(--line)}
.bar{cursor:pointer;outline:none}
.bar:hover rect:nth-child(2),.bar:focus-visible rect:nth-child(2){fill:var(--gold-dark)}
.day+.day{margin-top:14px}
.dayhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:600;font-size:14px;padding:8px 10px;background:var(--field);border-radius:8px}
.dayhead .num{font-weight:500}
.day .del{width:32px}
.status:empty{display:none}
.day .row{grid-template-columns:1fr auto auto;padding:9px 10px 9px 10px}
.day .row:first-of-type{border-top:0}
@media (max-width:760px){
  .summary{grid-template-columns:repeat(2,1fr)}
  .summary>.tile+.tile{border-left:0}
  .summary>.tile:nth-child(even){border-left:1px solid var(--line)}
  .summary>.tile:nth-child(n+3){border-top:1px solid var(--line)}
  .month{width:100%;justify-content:space-between}
  .month span{min-width:0;flex:1}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Мой кошелёк</h1>
      <p class="sub" id="subline">Доходы и расходы</p>
    </div>
    <div class="headright">
      <div class="month" role="group" aria-label="Период">
        <button class="iconbtn" id="prev" aria-label="Назад">‹</button>
        <span id="monthLabel">—</span>
        <button class="iconbtn" id="next" aria-label="Вперёд">›</button>
      </div>
      <div class="auth">
        <span id="who"></span>
        <button class="linkbtn" id="login" hidden>Войти</button>
        <button class="linkbtn" id="logout" hidden>Выйти</button>
      </div>
    </div>
  </header>

  <div class="setup" id="setup" hidden>
    <b>Сайт ещё не подключён к базе.</b> Вставь настройки Firebase в файл index.html, в блок <code>firebaseConfig</code>.
  </div>

  <nav class="periods" id="periods" aria-label="Период"></nav>

  <section class="summary" aria-label="Итоги за период">
    <div class="tile"><div class="lbl">Заработал</div><div class="big inc" id="sumInc">0 ₸</div></div>
    <div class="tile"><div class="lbl">Потратил</div><div class="big exp" id="sumExp">0 ₸</div></div>
    <div class="tile"><div class="lbl">Осталось</div><div class="big" id="sumBal">0 ₸</div></div>
    <div class="tile"><div class="lbl" id="avgLbl">В среднем в день</div><div class="big" id="sumAvg">—</div></div>
  </section>

  <section class="panel" id="formPanel" hidden>
    <h2>Новая запись</h2>
    <form id="form" autocomplete="off">
      <div class="seg" role="group" aria-label="Тип">
        <button type="button" class="e" id="tExp" aria-pressed="true">Расход</button>
        <button type="button" class="i" id="tInc" aria-pressed="false">Доход</button>
      </div>
      <div class="field"><label for="amount">Сумма, ₸</label><input id="amount" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="5000" required></div>
      <div class="field"><label for="category">Категория</label><select id="category"></select></div>
      <div class="field"><label for="date">Дата</label><input id="date" type="date" required></div>
      <div class="field note"><label for="note">На что (необязательно)</label><input id="note" type="text" maxlength="120" placeholder="Продукты в Magnum"></div>
      <button class="submit" id="save" type="submit">Добавить</button>
    </form>
  </section>
  <div class="status" id="status" role="status"></div>

  <section class="charts">
    <div class="panel">
      <h2>Куда ушли деньги</h2>
      <div id="donut"></div>
    </div>
    <div class="panel">
      <h2 id="barsTitle">Расходы по дням</h2>
      <div id="bars"></div>
    </div>
  </section>

  <section class="panel">
    <h2 id="listTitle">Записи по дням</h2>
    <div class="list" id="list"><p class="empty">Загружаю записи…</p></div>
  </section>
</div>

<script type="module">
// ================== НАСТРОЙКИ FIREBASE ==================
// Вставь сюда объект из Firebase Console → Project settings → Your apps → Web app.
const firebaseConfig = {
  apiKey: "AIzaSyBFfi_q5Tmwkew_z4-_zkpjJrck2uNHs6M",
  authDomain: "koshelek-d4846.firebaseapp.com",
  projectId: "koshelek-d4846",
  storageBucket: "koshelek-d4846.firebasestorage.app",
  messagingSenderId: "495940912953",
  appId: "1:495940912953:web:8b1eca1095acb6d5658ae8"
};
// ========================================================

const FB="https://www.gstatic.com/firebasejs/10.12.2/";

const CATS = {
  expense:["Еда","Кафе","Транспорт","Жильё","Связь и подписки","Одежда","Здоровье","Развлечения","Подарки","Другое"],
  income:["Зарплата","Подработка","Подарок","Кэшбэк","Другое"]
};
const COLORS = ["--c1","--c2","--c3","--c4","--c5","--c6","--c7","--c8","--c9","--c9"];
const MONTHS = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const MGEN = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const MSHORT = ["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];
const WD = ["вс","пн","вт","ср","чт","пт","сб"];
const WDFULL = ["Воскресенье","Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"];
const PERIODS = [["day","День"],["3d","3 дня"],["week","Неделя"],["month","Месяц"],["year","Год"],["all","Всё"]];
const $ = id => document.getElementById(id);
const fmt = n => new Intl.NumberFormat("ru-RU",{maximumFractionDigits:2}).format(n) + " ₸";
const fmtShort = n => n>=1e6 ? (n/1e6).toFixed(1).replace(".",",")+" млн" : n>=1e3 ? (n>=1e4?Math.round(n/1e3):Math.round(n/100)/10).toString().replace(".",",")+" тыс" : String(Math.round(n));
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);
const todayISO = () => iso(new Date());
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const setStatus = s => { $("status").textContent = s; };

let type = "expense", tx = [], loaded = false, canEdit = false, db = null, auth = null;
let period = "week";
try { const p = localStorage.getItem("koshelek-period"); if (PERIODS.some(x=>x[0]===p)) period = p; } catch(e) {}
let anchor = new Date(); anchor.setHours(0,0,0,0);

function fillCats(){ $("category").innerHTML = CATS[type].map(c=>`<option>${c}</option>`).join(""); }
function setType(t){ type=t; $("tExp").setAttribute("aria-pressed",t==="expense"); $("tInc").setAttribute("aria-pressed",t==="income"); fillCats(); }
$("tExp").onclick=()=>setType("expense");
$("tInc").onclick=()=>setType("income");
$("date").value = todayISO();
fillCats();

$("periods").innerHTML = PERIODS.map(([id,l])=>`<button type="button" data-p="${id}">${l}</button>`).join("");
$("periods").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  setPeriod(b.dataset.p);
});
function setPeriod(p, at){
  period = p; if (at) anchor = at;
  try { localStorage.setItem("koshelek-period", p); } catch(e) {}
  render();
}
function shift(dir){
  if (period==="day") anchor = addDays(anchor, dir);
  else if (period==="3d") anchor = addDays(anchor, 3*dir);
  else if (period==="week") anchor = addDays(anchor, 7*dir);
  else if (period==="month") anchor = new Date(anchor.getFullYear(), anchor.getMonth()+dir, 1);
  else if (period==="year") anchor = new Date(anchor.getFullYear()+dir, 0, 1);
  render();
}
$("prev").onclick=()=>shift(-1);
$("next").onclick=()=>shift(1);

// Returns {start, end} as Date (inclusive) for the chosen period
function range(){
  const a = anchor;
  if (period==="day") return {start:a, end:a};
  if (period==="3d") return {start:addDays(a,-2), end:a};
  if (period==="week"){ const wd=(a.getDay()+6)%7; const s=addDays(a,-wd); return {start:s, end:addDays(s,6)}; }
  if (period==="month") return {start:new Date(a.getFullYear(),a.getMonth(),1), end:new Date(a.getFullYear(),a.getMonth()+1,0)};
  if (period==="year") return {start:new Date(a.getFullYear(),0,1), end:new Date(a.getFullYear(),11,31)};
  const dates = tx.map(t=>t.date).filter(Boolean).sort();
  const today = new Date(); today.setHours(0,0,0,0);
  if (!dates.length) return {start:today, end:today};
  const last = parse(dates[dates.length-1]);
  return {start:parse(dates[0]), end: last>today?last:today};
}
const dayLabel = d => `${d.getDate()} ${MGEN[d.getMonth()]}`;
function rangeLabel({start,end}){
  if (period==="day"){ const t=todayISO(), y=iso(addDays(new Date(),-1)), s=iso(start);
    return (s===t?"Сегодня, ":s===y?"Вчера, ":"") + dayLabel(start); }
  if (period==="month") return `${MONTHS[start.getMonth()]} ${start.getFullYear()}`;
  if (period==="year") return String(start.getFullYear());
  if (period==="all") return "За всё время";
  if (start.getMonth()===end.getMonth()) return `${start.getDate()}–${end.getDate()} ${MGEN[end.getMonth()]}`;
  return `${dayLabel(start)} – ${dayLabel(end)}`;
}

const key = (y,m)=>`${y}-${pad(m+1)}`;
function catColor(cat){ const i=CATS.expense.indexOf(cat); return `var(${COLORS[i<0?9:i]})`; }
const daysBetween = (a,b) => Math.round((b-a)/86400000)+1;

function render(){
  for (const b of $("periods").children) b.setAttribute("aria-pressed", b.dataset.p===period);
  const r = range(); const s = iso(r.start), e = iso(r.end);
  $("monthLabel").textContent = rangeLabel(r);
  $("prev").disabled = $("next").disabled = period==="all";
  const items = tx.filter(t=>t.date && t.date>=s && t.date<=e).sort((a,b)=> b.date.localeCompare(a.date) || (b.createdAt||0)-(a.createdAt||0));
  const inc = items.filter(t=>t.type==="income").reduce((x,t)=>x+t.amount,0);
  const exp = items.filter(t=>t.type==="expense").reduce((x,t)=>x+t.amount,0);
  $("sumInc").textContent = fmt(inc);
  $("sumExp").textContent = fmt(exp);
  const bal = inc-exp;
  $("sumBal").textContent = (bal<0?"−":"") + fmt(Math.abs(bal));
  $("sumBal").className = "big " + (bal<0?"exp":"");
  // average per day: count only days up to today
  const today = new Date(); today.setHours(0,0,0,0);
  const lastDay = r.end>today ? today : r.end;
  const nDays = lastDay<r.start ? 0 : daysBetween(r.start, lastDay);
  $("sumAvg").textContent = nDays ? fmt(Math.round(exp/nDays)) : "—";
  $("avgLbl").textContent = period==="day" ? "Записей" : "В среднем в день";
  if (period==="day") $("sumAvg").textContent = String(items.length);
  renderDonut(items.filter(t=>t.type==="expense"), exp);
  renderBars(r);
  renderList(items);
}

function renderDonut(items,total){
  const box=$("donut");
  if(!total){ box.innerHTML=`<p class="empty">За этот период расходов нет.</p>`; return; }
  const by={}; items.forEach(t=>by[t.category]=(by[t.category]||0)+t.amount);
  const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  const R=62, C=2*Math.PI*R; let off=0;
  const arcs=rows.map(([c,v])=>{ const len=v/total*C; const s=`<circle r="${R}" cx="80" cy="80" fill="none" stroke="${catColor(c)}" stroke-width="26" stroke-dasharray="${Math.max(len-1.5,0.5)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)"><title>${esc(c)}: ${fmt(v)}</title></circle>`; off+=len; return s; }).join("");
  box.innerHTML = `<div class="donut-box">
    <svg width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="Расходы по категориям">
      <circle r="${R}" cx="80" cy="80" fill="none" stroke="var(--line)" stroke-width="26"/>${arcs}
      <text x="80" y="76" text-anchor="middle" fill="var(--muted)" font-size="11" font-family="var(--body)">всего</text>
      <text x="80" y="95" text-anchor="middle" fill="var(--ink)" font-size="15" font-family="var(--mono)">${fmtShort(total)}</text>
    </svg>
    <ul class="legend">${rows.map(([c,v])=>`<li><span class="sw" style="background:${catColor(c)}"></span><span>${esc(c)}<span class="pct">${Math.round(v/total*100)}%</span></span><span class="num">${fmt(v)}</span></li>`).join("")}</ul>
  </div>`;
}

// Bar chart of spending: per day for day/3d/week/month, per month for year/all
function renderBars(r){
  let buckets = [];
  const byMonth = period==="year" || (period==="all" && daysBetween(r.start,r.end)>62);
  if (byMonth){
    let y=r.start.getFullYear(), m=r.start.getMonth();
    while (y<r.end.getFullYear() || (y===r.end.getFullYear() && m<=r.end.getMonth())){
      const k=key(y,m);
      buckets.push({k, match:t=>t.date.startsWith(k), label:MSHORT[m]+(period==="all"&&m===0?" "+String(y).slice(2):""), title:`${MONTHS[m]} ${y}`, go:()=>setPeriod("month", new Date(y,m,1)), active:false});
      m++; if(m>11){m=0;y++;}
    }
  } else {
    // a single day gets context: the 7 days ending on it
    const s = period==="day" ? addDays(r.start,-6) : r.start;
    const n = daysBetween(s, r.end);
    for (let i=0;i<n;i++){
      const d=addDays(s,i), k=iso(d);
      const lbl = n<=7 ? `${WD[d.getDay()]} ${d.getDate()}` : String(d.getDate());
      buckets.push({k, match:t=>t.date===k, label:lbl, title:`${WDFULL[d.getDay()]}, ${dayLabel(d)}`, go:()=>setPeriod("day", d), active: period==="day" && k===iso(r.start), weekend: d.getDay()===0||d.getDay()===6});
    }
  }
  buckets.forEach(b=>{ b.v = tx.reduce((x,t)=> t.type==="expense" && t.date && b.match(t) ? x+t.amount : x, 0); });
  $("barsTitle").textContent = byMonth ? "Расходы по месяцам" : "Расходы по дням";
  const max = Math.max(...buckets.map(b=>b.v));
  if(!max){ $("bars").innerHTML=`<p class="empty">За эти дни трат нет.</p>`; return; }
  const p=Math.pow(10,Math.floor(Math.log10(max))); let top=Math.ceil(max/p)*p; if(top<max*1.08) top+=p/2;
  const n=buckets.length;
  const W=Math.max(280, Math.round($("bars").clientWidth || 440)),H=220,L=48,B=28,T=16, cw=(W-L-6)/n, bw=Math.max(3,Math.min(34,cw*0.62)), ph=H-B-T;
  const yv=v=>T+ph-(v/top)*ph;
  const every = Math.ceil(n/10);
  let g="";
  for(let i=0;i<=4;i++){ const v=top*i/4, yy=yv(v); g+=`<line x1="${L}" x2="${W-4}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${yy+4}" text-anchor="end" font-size="10.5" fill="var(--muted)" font-family="var(--mono)">${fmtShort(v)}</text>`; }
  const bars = buckets.map((b,i)=>{
    const cx=L+cw*i+cw/2, h=Math.max(T+ph-yv(b.v), b.v?2:0);
    const dim = period==="day" && !b.active;
    const showLbl = i%every===0 || i===n-1;
    const val = n<=10 && b.v ? `<text x="${cx}" y="${yv(b.v)-5}" text-anchor="middle" font-size="10.5" fill="var(--ink)" font-family="var(--mono)">${fmtShort(b.v)}</text>` : "";
    return `<g class="bar" data-i="${i}" tabindex="0" role="button" aria-label="${esc(b.title)}: ${fmt(b.v)}">
      <rect x="${L+cw*i}" y="${T}" width="${cw}" height="${ph+B}" fill="transparent"/>
      <rect x="${cx-bw/2}" y="${T+ph-h}" width="${bw}" height="${h}" rx="${Math.min(4,bw/3)}" fill="var(--expense)" opacity="${dim?.4:1}"/>
      ${val}
      ${showLbl?`<text x="${cx}" y="${H-9}" text-anchor="middle" font-size="11" fill="${b.active?"var(--ink)":b.weekend?"var(--gold-dark)":"var(--muted)"}" font-weight="${b.active?600:400}" font-family="var(--body)">${b.label}</text>`:""}
      <title>${esc(b.title)}: ${fmt(b.v)}</title></g>`;
  }).join("");
  const counted = buckets.filter(b=>b.k<=todayISO() || byMonth);
  const avg = counted.length ? counted.reduce((x,b)=>x+b.v,0)/counted.length : 0;
  const avgLine = n>1 && avg ? `<line x1="${L}" x2="${W-4}" y1="${yv(avg)}" y2="${yv(avg)}" stroke="var(--gold)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${W-4}" y="${yv(avg)-5}" text-anchor="end" font-size="10.5" fill="var(--gold-dark)" font-family="var(--body)">в среднем ${fmtShort(avg)}</text>` : "";
  $("bars").innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${$("barsTitle").textContent}">${g}${bars}${avgLine}</svg>`;
  $("bars").querySelectorAll(".bar").forEach(el=>{
    const go=()=>buckets[+el.dataset.i].go();
    el.addEventListener("click", go);
    el.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); go(); } });
  });
}

function renderList(items){
  $("listTitle").textContent = "Записи по дням";
  if(!items.length){ $("list").innerHTML=`<p class="empty">${loaded?"За этот период записей нет.":"Загружаю записи…"}</p>`; return; }
  const days = [];
  items.forEach(t=>{ let d=days[days.length-1]; if(!d||d.date!==t.date){ d={date:t.date, items:[], exp:0, inc:0}; days.push(d); } d.items.push(t); if(t.type==="income") d.inc+=t.amount; else d.exp+=t.amount; });
  $("list").innerHTML = days.map(d=>{
    const dt=parse(d.date);
    const head = `<div class="dayhead"><span>${WDFULL[dt.getDay()]}, ${dayLabel(dt)}</span><span class="num">${d.inc?`<span class="inc">+${fmt(d.inc)}</span> `:""}${d.exp?`<span class="exp">−${fmt(d.exp)}</span>`:""}</span></div>`;
    const rows = d.items.map(t=>{
      const sign=t.type==="income"?"+":"−";
      const del = canEdit ? `<button class="del" data-id="${esc(t.id)}" aria-label="Удалить запись">×</button>` : "";
      return `<div class="row"><span class="t"><b>${esc(t.category)}</b>${t.note?`<small>${esc(t.note)}</small>`:""}</span><span class="num ${t.type==="income"?"inc":"exp"}">${sign}${fmt(t.amount)}</span>${del}</div>`;
    }).join("");
    return `<div class="day">${head}${rows}</div>`;
  }).join("");
}

render();
let rz; addEventListener("resize", ()=>{ clearTimeout(rz); rz=setTimeout(render,150); });

if(!firebaseConfig.apiKey){
  $("setup").hidden = false;
  loaded = true; render();
} else {
  start().catch(e=>{ loaded=true; render(); setStatus("Не получилось подключиться к базе: " + e.message); });
}

async function start(){
  const [{ initializeApp }, { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot }, { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, signOut, onAuthStateChanged }] =
    await Promise.all([import(FB+"firebase-app.js"), import(FB+"firebase-firestore.js"), import(FB+"firebase-auth.js")]);
  const app = initializeApp(firebaseConfig);
  db = getFirestore(app);
  auth = getAuth(app);
  const txCol = collection(db, "tx");

  onSnapshot(txCol, snap=>{
    tx = snap.docs.map(d=>({id:d.id, ...d.data()})).filter(t=>typeof t.amount==="number");
    loaded = true; render();
  }, err=>{ loaded = true; render(); setStatus("Не получилось загрузить записи: " + err.message); });

  onAuthStateChanged(auth, user=>{
    canEdit = !!user;
    $("formPanel").hidden = !user;
    $("login").hidden = !!user;
    $("logout").hidden = !user;
    $("who").textContent = user ? (user.displayName || user.email || "") : "";
    $("subline").textContent = user ? "Доходы и расходы" : "Доходы и расходы. Только просмотр.";
    render();
  });

  $("login").onclick = async ()=>{
    const provider = new GoogleAuthProvider();
    try { await signInWithPopup(auth, provider); }
    catch(e){
      if(e.code==="auth/popup-blocked" || e.code==="auth/operation-not-supported-in-this-environment"){ await signInWithRedirect(auth, provider); }
      else if(e.code!=="auth/popup-closed-by-user" && e.code!=="auth/cancelled-popup-request"){ setStatus("Не получилось войти: " + e.message); }
    }
  };
  $("logout").onclick = ()=>signOut(auth);

  $("list").addEventListener("click", async e=>{
    const b=e.target.closest(".del"); if(!b) return;
    if(b.dataset.confirm!=="1"){ b.dataset.confirm="1"; b.textContent="?"; b.setAttribute("aria-label","Нажми ещё раз, чтобы удалить"); setTimeout(()=>{ if(b.isConnected){b.dataset.confirm="";b.textContent="×";} },2500); return; }
    try{ await deleteDoc(doc(db,"tx",b.dataset.id)); setStatus("Запись удалена"); }
    catch(err){ setStatus(err.code==="permission-denied" ? "Этот аккаунт не может менять записи." : "Не получилось удалить: "+err.message); }
  });

  $("form").addEventListener("submit", async e=>{
    e.preventDefault();
    const amount=parseFloat(String($("amount").value).replace(",","."));
    if(!(amount>0)){ setStatus("Введи сумму больше нуля"); return; }
    $("save").disabled=true;
    try{
      await addDoc(txCol, {type, amount:Math.round(amount*100)/100, category:$("category").value, note:$("note").value.trim(), date:$("date").value, createdAt:Date.now()});
      $("amount").value=""; $("note").value="";
      const d=parse($("date").value); const r=range(); if(iso(d)<iso(r.start)||iso(d)>iso(r.end)) anchor=d; render();
      setStatus(type==="income"?"Доход записан":"Расход записан");
      $("amount").focus();
    }catch(err){ setStatus(err.code==="permission-denied" ? "Этот аккаунт не может менять записи. Войди своим Google-аккаунтом." : "Не получилось сохранить: "+err.message); }
    finally{ $("save").disabled=false; }
  });
}
</script>
</body>
